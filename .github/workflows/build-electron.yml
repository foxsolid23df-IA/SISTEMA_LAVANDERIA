name: Build and Release Electron

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Root Dependencies
        run: npm install

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://jugyosyrbixwsmzvdksp.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_pkUlkLzd6rPbvG9dD4usPg_qALhsbSd"

      - name: Prepare Backend
        run: node scripts/prepare-backend.js

      - name: Build and Package Electron App
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            npx electron-builder --win --x64 --publish always
          } else {
            npx electron-builder --win --x64
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Electron-Installer
          path: release/*.exe
