name: Build and Release Electron

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://jugyosyrbixwsmzvdksp.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_pkUlkLzd6rPbvG9dD4usPg_qALhsbSd"

      - name: Prepare Backend
        run: node scripts/prepare-backend.js

      - name: Build and Publish to GitHub Releases
        run: npx electron-builder --win --x64 --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
