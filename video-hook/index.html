<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Cyber-Hook</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script>
        // Pre-registro para asegurar que el contrato se cumpla inmediatamente
        window.__timelines = window.__timelines || {};
    </script>
</head>
<body>
    <div id="stage" 
         data-composition-id="hook-tiktok" 
         data-width="1080" 
         data-height="1920" 
         data-duration="10" 
         data-fps="30"
         data-start="0">
        <script>
            // Aseguramos que el ID de la composición esté disponible para GSAP
            window.COMPOSITION_ID = "hook-tiktok";
        </script>
        
        <!-- Fondo Técnico -->
        <div id="bg-layer" class="layer bg-layer clip" data-start="0" data-duration="10">
            <div id="grid-container" class="grid"></div>
            <div class="vignette"></div>
        </div>

        <!-- Escaneo Láser -->
        <div id="scan-layer" class="layer scan-layer clip" data-start="0" data-duration="7.2">
            <div id="laser-line" class="laser-line"></div>
        </div>

        <!-- Capa de Datos (HUD) -->
        <div id="hud-layer" class="layer hud-layer clip" data-start="0" data-duration="10">
            <div class="hud-item top-left">SYS_v2.0</div>
            <div class="hud-item top-right">LOC: CLOUD_WASH</div>
            <div class="hud-item bottom-left" id="efficiency-counter">EFFICIENCY: 0%</div>
            <div class="hud-item bottom-right">REC: ACTIVE</div>
        </div>

        <!-- Contenido de Texto -->
        <div class="layer text-layer">
            <div id="hook-box" class="hook-box clip" data-start="0.5" data-duration="2.5">
                <h1 class="glitch" data-text="DIRTY DATA">DIRTY DATA</h1>
                <p>DETECTED IN SECTOR_7</p>
            </div>

            <div id="process-box" class="process-box clip" data-start="3" data-duration="4.2">
                <h2 class="acid-text">NEUTRALIZING...</h2>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>

            <div id="cta-box" class="cta-box clip" data-start="7.5" data-duration="2.5">
                <h1 class="logo-text">WASH.EXE</h1>
                <p class="blink">LAVANDERÍA DEL FUTURO</p>
                <div id="qr-app" class="qr-placeholder">APP</div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
