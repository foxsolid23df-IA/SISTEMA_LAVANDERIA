<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comercial Sistema Lavandería</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script>window.__timelines = window.__timelines || {};</script>
</head>
<body>
    <div id="stage" 
         data-composition-id="comercial-90s" 
         data-width="1920" 
         data-height="1080" 
         data-duration="90" 
         data-fps="30"
         data-start="0">
        
        <script>window.COMPOSITION_ID = "comercial-90s";</script>

        <!-- TRACK 0: VOZ (TTS) -->
        <audio id="tts-audio" src="assets/voiceover.mp3" data-start="0" data-duration="90" data-volume="1.0" data-track-index="0"></audio>
        
        <!-- TRACK 1: MÚSICA -->
        <audio id="bg-music" src="assets/music.mp3" data-start="0" data-duration="90" data-volume="0.3" data-track-index="1"></audio>

        <!-- TRACK 2: FONDO Y TEXTURA -->
        <div class="layer bg-layer clip" data-start="0" data-duration="90" data-track-index="2">
            <div class="bg-gradient"></div>
            <div class="grid-overlay"></div>
        </div>

        <!-- TRACK 3: CAPTURAS DEL SISTEMA (Placeholders) -->
        <div id="system-captures" class="layer media-layer clip" data-start="0" data-duration="90" data-track-index="3">
            <!-- REEMPLAZAR src con tus imágenes reales -->
            <img id="cap-login" src="assets/login.png" class="screenshot" alt="Login">
            <img id="cap-dashboard" src="assets/dashboard.png" class="screenshot" alt="Dashboard">
            <img id="cap-orders" src="assets/orders.png" class="screenshot" alt="Orders">
            <img id="cap-tickets" src="assets/tickets.png" class="screenshot" alt="Tickets">
            <img id="cap-reports" src="assets/reports.png" class="screenshot" alt="Reports">
        </div>

        <!-- TRACK 4: TEXTOS Y ELEMENTOS DE MARKETING -->
        <div id="marketing-overlay" class="layer text-layer clip" data-start="0" data-duration="90" data-track-index="4">
            
            <!-- HOOK (0-5s) -->
            <div id="hook-content" class="scene-group">
                <h1 class="giant-text">¿TU LAVANDERÍA<br><span class="highlight">PIERDE DINERO?</span></h1>
                <div id="money-leak" class="money-anim">
                    <div class="dollar-sign">$</div>
                    <div class="dollar-sign">$</div>
                    <div class="dollar-sign">$</div>
                </div>
            </div>

            <!-- PAIN (5-15s) -->
            <div id="pain-content" class="scene-group">
                <div class="pain-word" id="pw1">DESORDEN</div>
                <div class="pain-word" id="pw2">EXTRAVÍOS</div>
                <div class="pain-word" id="pw3">CAOS</div>
            </div>

            <!-- SOLUTION (15-35s) -->
            <div id="solution-content" class="scene-group">
                <h2 class="section-title">CONTROL TOTAL</h2>
                <p class="feature-tag">EN LA PALMA DE TU MANO</p>
            </div>

            <!-- BENEFITS (35-60s) -->
            <div id="benefits-content" class="scene-group">
                <div class="benefit-item" id="b1">REDUCE ERRORES AL 0%</div>
                <div class="benefit-item" id="b2">CONTROLA TUS INGRESOS</div>
                <div class="benefit-item" id="b3">ENTRENA EN MINUTOS</div>
            </div>

            <!-- CTA (75-90s) -->
            <div id="cta-content" class="scene-group">
                <h1 class="final-text">DEJA DE PERDER DINERO HOY</h1>
                <div class="cta-box">
                    <div class="cta-button">AGENDA TU DEMO</div>
                    <p class="contact-info">www.tu-sitio.com | WhatsApp: +52 123 456 7890</p>
                </div>
            </div>
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
